# Known security advisories, and licences that don't fit GPL-2.0-or-later. deny.toml says which.
name: Dependencies

on:
  # Every pull request, so the check is there to be asked for whatever the pull request touches.
  pull_request:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, deny.toml, .github/workflows/deny.yml]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: deny-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories bans licenses sources
