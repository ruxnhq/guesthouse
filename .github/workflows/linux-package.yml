# Builds the Linux guest's driver package for the Mac host from this repo and ruxnlabs/mesa alone,
# on an arm64 runner in an Ubuntu 26.04 container, with guest/drivers/linux-pvg/package/build-here.sh: the
# module's DKMS package (built once by DKMS as a check), our Mesa in /opt/pvg-mesa, the desktop
# packages, install.sh and the manifest. A pull request only builds it.
#
# On a push to main, or by hand, it also publishes it on files.ruxn.com/p/guesthouse-linux-driver/,
# a project of its own on the file site, where the Mac app fetches guesthouse-linux-driver-latest.json
# and the files it names. It has no secret: the Worker takes the job's OIDC token
# (scripts/files-publish.sh). A version is published once. When the manifest that's up already names
# this version, nothing is sent, so a change that should reach the guests also raises
# guest/drivers/linux-pvg/package/version.txt.
name: Linux driver package

on:
  pull_request:
    paths:
      - guest/drivers/linux-pvg/**
      - .github/workflows/linux-package.yml
  push:
    branches: [main]
    paths:
      - guest/drivers/linux-pvg/**
      - .github/workflows/linux-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: package on Ubuntu 26.04 arm64
    runs-on: ubuntu-24.04-arm
    container: ubuntu:26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install what the build needs
        env:
          PVG_HEADERS: linux-headers-generic
        run: sh guest/drivers/linux-pvg/package/vm-packages.sh
      - name: Build the package
        env:
          PVG_WORK: /tmp/pvg-work
        run: sh guest/drivers/linux-pvg/package/build-here.sh "$PWD" target/linux-pvg/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-driver-package
          path: target/linux-pvg/package
          retention-days: 14

  publish:
    name: put it on files.ruxn.com
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-driver-package
          path: package
      - name: Check the package against its manifest
        run: |
          set -eu
          . guest/drivers/linux-pvg/package/lib.sh
          version=$(jq -r .version "package/$pvg_manifest_name")
          [ "$version" = "$(cat guest/drivers/linux-pvg/package/version.txt)" ]
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          for f in $(pvg_package_files "$version"); do
            want=$(jq -r --arg f "$f" '.files[] | select(.as == $f) | .sha256' "package/$pvg_manifest_name")
            [ "$want" = "$(pvg_sha256 "package/$f")" ]
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish the files, then the manifest
        run: |
          set -eu
          . guest/drivers/linux-pvg/package/lib.sh
          project=guesthouse-linux-driver
          site=https://files.ruxn.com/p/$project
          up=$(curl -fsSL "$site/$pvg_manifest_name" 2>/dev/null | jq -r .version 2>/dev/null || true)
          if [ "$up" = "$VERSION" ]; then
            echo "Version $VERSION is published already. Raise version.txt to publish a new one."
            exit 0
          fi
          # A file of this version that's up already (from a run that stopped before the manifest)
          # never changes: take it as it is, and make the manifest from what's really up.
          for f in $(pvg_package_files "$VERSION"); do
            if curl -fsL -o published "$site/$(pvg_published_name "$VERSION" "$f")"; then
              echo "$f is up already; using it as it is."
              mv published "package/$f"
            fi
          done
          pvg_write_manifest package "$VERSION"
          pvg_publish_folder package "$VERSION" publish
          files=
          for f in $(pvg_package_files "$VERSION"); do
            files="$files publish/$(pvg_published_name "$VERSION" "$f")"
          done
          # shellcheck disable=SC2086 # the names have no spaces
          scripts/files-publish.sh "$project" $files
          scripts/files-publish.sh --replace "$project" "publish/$pvg_manifest_name"
