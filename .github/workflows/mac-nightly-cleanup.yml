# Removes the Mac nightlies from files.ruxn.com once they are 14 days old, as test-build-cleanup.yml does
# for test builds. mac-nightly.yml makes them. The newest dated nightly with its hash, the fixed-name copy and guesthouse-macos-nightly.json are
# always kept. It does nothing until the repository has the variable FILES_BUCKET (the bucket that serves
# files.ruxn.com) and the `mac-nightly-cleanup` environment has the bucket's keys.
name: Mac nightly cleanup

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: remove old nightlies
    if: github.ref == 'refs/heads/main' && vars.FILES_BUCKET != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mac-nightly-cleanup
    env:
      FILES_BUCKET: ${{ vars.FILES_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      PREFIX: pub/guesthouse-nightly/
      DAYS: "14"
    steps:
      - run: |
          set -eu
          s3() { aws --endpoint-url "$R2_ENDPOINT" "$@"; }
          oldest_kept=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%S)
          # The newest image is kept, whatever its age, so the nightly file never points at nothing.
          newest=$(s3 s3api list-objects-v2 --bucket "$FILES_BUCKET" --prefix "$PREFIX" \
            --query "max_by(Contents[?starts_with(Key, \`pub/guesthouse-nightly/Guesthouse-nightly-\`) && ends_with(Key, \`.dmg\`)], &LastModified).Key" --output text)
          for key in $(s3 s3api list-objects-v2 --bucket "$FILES_BUCKET" --prefix "$PREFIX" \
              --query 'Contents[].Key' --output text | tr '\t' '\n'); do
            # Only a dated image and its hash, by the Worker's names. The three names that are replaced
            # (Guesthouse-nightly.dmg, its .sha256 and guesthouse-macos-nightly.json) never match.
            printf '%s\n' "$key" | grep -Eq "^${PREFIX}Guesthouse-nightly-[0-9]{8}-[0-9a-f]{8}\.dmg(\.sha256)?\$" || continue
            [ "$key" = "$newest" ] && continue
            [ "$key" = "$newest.sha256" ] && continue
            when=$(s3 s3api head-object --bucket "$FILES_BUCKET" --key "$key" --query LastModified --output text)
            if [ "${when%%.*}" \< "$oldest_kept" ]; then
              echo "removing $key, from $when"
              s3 s3 rm "s3://$FILES_BUCKET/$key" --only-show-errors
            fi
          done
