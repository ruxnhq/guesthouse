# The Nix package and NixOS module: that the flake evaluates, the package builds, and a NixOS machine with
# the module on comes up as it should.
name: Nix

on:
  pull_request:
    paths: [flake.nix, flake.lock, packaging/nix/**, .github/workflows/nix.yml]
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, packaging/nix/**, .github/workflows/nix.yml]

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      # The module's test boots a NixOS machine, which wants KVM.
      - name: Let Nix use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: nix build .#guesthouse --print-build-logs
      - run: nix flake check --print-build-logs
