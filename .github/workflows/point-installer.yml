# Step 7 of RELEASING.md: after a Linux release (vX.Y.Z) is published, opens the pull request that
# points install.sh, the Nix package, the README and the site at it. It checks the release's downloads
# against its SHA256SUMS and the release build's record of them first, and the AppImage on files.ruxn.com against it too. If the AppImage
# isn't there within half an hour the pull request is a draft, to be marked ready once it is.
# Step 5 of the Windows host's: after a Windows release (windows-vX.Y.Z) is published, opens "Point
# the site at Windows X.Y.Z", which changes only the Windows version, link, name, size and hash link in
# site/public/index.html. It checks the installer against its .sha256 first, and the .sha256 on
# files.ruxn.com against the release's. If that isn't there within half an hour it's a draft too.
# With RELEASE_PR_TOKEN it turns on auto-merge for a pull request that isn't a draft, so it merges
# once the checks pass; a draft waits for a person. The site deploys itself from main (site-deploy.yml).
#
# Secret, optional: RELEASE_PR_TOKEN, a fine-grained token for this repo with Contents and Pull
# requests read and write. Without it the pull request comes from GITHUB_TOKEN, which needs
# "Allow GitHub Actions to create and approve pull requests" in the repo's Actions settings, and
# whose pull requests don't start the checks, so auto-merge is left off.
name: Point the installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point at, like v0.10.0 or windows-v0.12.0
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: point-installer
  cancel-in-progress: false

jobs:
  point:
    name: open the pull request
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && (startsWith(github.event.release.tag_name, 'v') || startsWith(github.event.release.tag_name, 'windows-v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          persist-credentials: true

      - name: Check the tag and what main says now
        id: tag
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) HOST=linux; VERSION=${TAG#v} ;;
            windows-v[0-9]*.[0-9]*.[0-9]*) HOST=windows; VERSION=${TAG#windows-v} ;;
            *) echo "$TAG isn't a release tag."; exit 1 ;;
          esac
          case "$VERSION" in
            *[!0-9.]*) echo "$TAG isn't a plain version."; exit 1 ;;
          esac
          if [ "$HOST" = windows ]; then
            CURRENT=$(sed -n 's/.*Windows <b>\([0-9][0-9.]*\)<\/b>.*/\1/p' site/public/index.html | head -n 1)
          else
            CURRENT=$(sed -n 's/^RELEASE_VERSION="\(.*\)"$/\1/p' install.sh)
          fi
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "main already points at $VERSION."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CURRENT" ] && [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "::error::main points at $CURRENT, which is newer than $VERSION."
            exit 1
          fi
          {
            echo "host=$HOST"
            echo "version=$VERSION"
            echo "old=$CURRENT"
          } >>"$GITHUB_OUTPUT"

      - name: Download the release and check it against SHA256SUMS
        if: steps.tag.outputs.skip != 'true' && steps.tag.outputs.host == 'linux'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS \
            -p "guesthouse-$VERSION-x86_64.tar.xz" -p "guesthouse-$VERSION-source.tar.xz"
          grep -E " \*?guesthouse-$VERSION-(x86_64|source)\.tar\.xz\$" SHA256SUMS | sha256sum -c -
          # And against the record the release build made of them, which the release's own files can't change.
          for file in SHA256SUMS "guesthouse-$VERSION-x86_64.tar.xz" "guesthouse-$VERSION-source.tar.xz"; do
            gh attestation verify "$file" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml"
          done
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets \
            -q ".assets[] | select(.name == \"guesthouse-installer-$VERSION.AppImage\") | .size" >appimage-size
          [ -s appimage-size ] || { echo "::error::The release has no AppImage."; exit 1; }
          stat -c %s "guesthouse-$VERSION-x86_64.tar.xz" >payload-size

      - name: Download the Windows installer and check it against its .sha256
        if: steps.tag.outputs.skip != 'true' && steps.tag.outputs.host == 'windows'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          SETUP="guesthouse-setup-$VERSION.exe"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$SETUP" -p "$SETUP.sha256"
          SAID=$(tr -d '\r' <"$SETUP.sha256" | awk 'NR==1 {print $1}')
          echo "$SAID  $SETUP" | sha256sum -c -
          stat -c %s "$SETUP" >setup-size

      - name: Wait for the installer's hash on files.ruxn.com
        if: steps.tag.outputs.skip != 'true'
        id: files
        env:
          HOST: ${{ steps.tag.outputs.host }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/release"
          if [ "$HOST" = windows ]; then
            NAME="guesthouse-setup-$VERSION.exe"
            WANT=$(tr -d '\r' <"$NAME.sha256" | awk 'NR==1 {print $1}')
            WHAT="installer's"
          else
            NAME="guesthouse-installer-$VERSION.AppImage"
            WANT=$(grep -E " \*?$NAME\$" SHA256SUMS | cut -d' ' -f1)
            WHAT="AppImage's"
            [ -n "$WANT" ] || { echo "::error::SHA256SUMS has no line for the AppImage."; exit 1; }
          fi
          for _ in $(seq 1 60); do
            GOT=$(curl -fsSL "https://files.ruxn.com/p/guesthouse/$NAME.sha256" 2>/dev/null | awk 'NR==1 {print $1}' || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "The $WHAT hash is on files.ruxn.com."
              echo "up=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::The $WHAT hash isn't on files.ruxn.com, or it differs. The pull request will be a draft."
          echo "up=false" >>"$GITHUB_OUTPUT"

      - name: Point the files at the release
        if: steps.tag.outputs.skip != 'true'
        id: point
        env:
          HOST: ${{ steps.tag.outputs.host }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # A refusal from the script has to stop the run, not hide behind tee's exit status.
          set -o pipefail
          R="$RUNNER_TEMP/release"
          if [ "$HOST" = windows ]; then
            python3 scripts/point-installer.py windows "$VERSION" "$R/guesthouse-setup-$VERSION.exe.sha256" "$(cat "$R/setup-size")" | tee "$R/printed"
            git diff --stat
            echo "size=$(sed -n 's/^size=//p' "$R/printed")" >>"$GITHUB_OUTPUT"
          else
            python3 scripts/point-installer.py "$VERSION" "$R/SHA256SUMS" "$(cat "$R/payload-size")" "$(cat "$R/appimage-size")" | tee "$R/printed"
            git diff --stat
            {
              echo "payload=$(sed -n 's/^payload=//p' "$R/printed")"
              echo "source=$(sed -n 's/^source=//p' "$R/printed")"
              echo "nix=$(sed -n 's/^nix=//p' "$R/printed")"
            } >>"$GITHUB_OUTPUT"
          fi

      - name: Open the pull request
        if: steps.tag.outputs.skip != 'true'
        env:
          HOST: ${{ steps.tag.outputs.host }}
          VERSION: ${{ steps.tag.outputs.version }}
          OLD: ${{ steps.tag.outputs.old }}
          SIZE: ${{ steps.point.outputs.size }}
          PAYLOAD: ${{ steps.point.outputs.payload }}
          SOURCE: ${{ steps.point.outputs.source }}
          NIX: ${{ steps.point.outputs.nix }}
          FILES_UP: ${{ steps.files.outputs.up }}
          HAVE_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
        run: |
          if [ "$HOST" = windows ]; then
            BRANCH="point-site-windows-$VERSION"
            TITLE="Point the site at Windows $VERSION"
            FILES=(site/public/index.html)
            MESSAGE="The site names Windows $VERSION: the version at the top, the installer's link, name and size, and its hash link."
          else
            BRANCH="point-installer-$VERSION"
            TITLE="Point the installer at $VERSION"
            FILES=(install.sh packaging/nix/package.nix README.md site/public/index.html)
            MESSAGE="install.sh, the Nix package, the README and the site name $VERSION."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "${FILES[@]}"
          git commit -m "$TITLE" -m "$MESSAGE"
          git push --force origin "$BRANCH"

          {
            if [ "$HOST" = windows ]; then
              echo "Windows $VERSION is released. This points the site at it, and changes nothing else."
              echo
              echo "The installer is $SIZE. It was downloaded again and matches its .sha256, and the installer's hash on files.ruxn.com is the same."
              echo
              if [ "$FILES_UP" != "true" ]; then
                echo "The installer's hash wasn't on files.ruxn.com yet when this was made, so this is a draft. Mark it ready once the installer and its .sha256 are up."
                echo
              fi
            else
              echo "$VERSION is uploaded. This points install.sh, the Nix package, the README and the site at it."
              echo
              echo "Payload $PAYLOAD, source $SOURCE, Nix $NIX. The release's payload and source were downloaded again and match SHA256SUMS, and the AppImage's hash on files.ruxn.com is the one in SHA256SUMS."
              echo
              if [ "$FILES_UP" != "true" ]; then
                echo "The AppImage's hash wasn't on files.ruxn.com yet when this was made, so this is a draft. Mark it ready once the AppImage and its .sha256 are up."
                echo
              fi
            fi
            echo "Reverting this puts everyone back on ${OLD:-the release before}. Once it is merged the site deploys by itself."
          } >"$RUNNER_TEMP/body.md"

          DRAFT=()
          [ "$FILES_UP" = "true" ] || DRAFT=(--draft)
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" "${DRAFT[@]}"
          fi

          # Only a pull request that's ready merges by itself, once the required checks pass. A draft
          # (the file isn't up) needs a person to look first, so it's left alone. Without the
          # token the checks never start, so auto-merge would wait for nothing.
          if [ "$FILES_UP" != "true" ]; then
            echo "The pull request is a draft, so auto-merge is left off."
          elif [ "$HAVE_TOKEN" != "true" ]; then
            echo "::warning::RELEASE_PR_TOKEN isn't set, so auto-merge is left off."
          else
            gh pr merge "$BRANCH" --auto --squash
          fi
