# Builds Proxmox VE's QEMU package with the GPU-PV devices, the way packaging/proxmox/build-pve-qemu-kvm.sh
# does on a PC, from the pve-qemu-kvm that Proxmox's repository has that day. So a patch that stops
# applying to a new release of Proxmox's fails here, not on someone's host. QEMU takes a long time, so a
# PR only runs it when the patch or the script changes, and a PR or a push publishes nothing.
#
# The nightly run and a manual one put a new package in the testing suite of pkg.ruxn.com/proxmox, signed,
# with a build attestation. A version that's published already isn't built again: the nightly skips it,
# and a manual run refuses it, so give that one another suffix. proxmox-stable.yml moves a package from
# testing to stable.
name: Proxmox package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: What to build of pve-qemu.git, such as 11.1.3-4. Empty is the newest in Proxmox's repository.
        required: false
        type: string
      suffix:
        description: What goes after Proxmox's version. A new one, such as +gpupv2, for a patch that changed while Proxmox's version didn't.
        required: false
        default: "+gpupv1"
        type: string
  schedule:
    - cron: "43 3 * * *"
  pull_request:
    paths: [qemu/qemu-gpupv.patch, packaging/proxmox/build-pve-qemu-kvm.sh, .github/workflows/proxmox.yml]
  push:
    branches: [main]
    paths: [qemu/qemu-gpupv.patch, packaging/proxmox/build-pve-qemu-kvm.sh, .github/workflows/proxmox.yml]

permissions:
  contents: read

concurrency:
  group: proxmox-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: what to build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
          SUFFIX: ${{ inputs.suffix }}
        run: sh packaging/packages/proxmox-plan.sh "$EVENT" "$REF" "${SUFFIX:-+gpupv1}"

  package:
    name: pve-qemu-kvm with GPU-PV
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script ends by looking in the package's QEMU for each device a GPU-PV VM names.
      - name: Build the package
        env:
          REF: ${{ needs.plan.outputs.ref }}
          SUFFIX: ${{ inputs.suffix }}
          DEBFULLNAME: ruxn labs
          DEBEMAIL: packages@ruxn.com
        run: sh packaging/proxmox/build-pve-qemu-kvm.sh --suffix "${SUFFIX:-+gpupv1}" "$REF"
      # The script prints a failed build's last 30 lines, which name a patch that doesn't apply. What a
      # compiler says can be further up.
      - name: Show more of the log
        if: failure()
        run: |
          for log in build/proxmox/submodule.log build/proxmox/build.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"
            tail -n 300 "$log"
            echo "::endgroup::"
          done
      # The debug symbols stay with the run, and only the package goes in the repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.publish == 'true'
        with:
          name: pve-qemu-kvm
          path: |
            build/proxmox/pve-qemu-kvm*.deb
            build/proxmox/SHA256SUMS
          retention-days: 30
          compression-level: 0

  publish:
    name: publish in testing
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment holds the signing key and the bucket's token, and only main may use it.
    environment: packages
    permissions:
      contents: read
      id-token: write
      attestations: write
    concurrency:
      group: pkg-proxmox
      cancel-in-progress: false
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pve-qemu-kvm
          path: dist
      - name: Find the package
        id: package
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          set -- pve-qemu-kvm_*_amd64.deb
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one package, found: $*"; exit 1; }
          echo "file=dist/$1" >>"$GITHUB_OUTPUT"
          echo "version=$(dpkg-deb -f "$1" Version)" >>"$GITHUB_OUTPUT"
      - name: Take the signing key
        env:
          SIGNING_KEY_SECRET: ${{ secrets.PKG_SIGNING_KEY }}
        run: sh packaging/packages/signing-key.sh "$RUNNER_TEMP"
      - name: Check it isn't published already
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          sh packaging/packages/bucket.sh pull proxmox repo
          # The plan looked at what's served. This is the bucket itself, which is what counts.
          if grep -hqxF "Version: $VERSION" repo/dists/*/main/binary-amd64/Packages 2>/dev/null; then
            echo "::error::$VERSION is published already, and what's published never changes."
            exit 1
          fi
      # Signing the index leaves the package as it is, so this is the file as published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - name: Add it to testing
        env:
          FILE: ${{ steps.package.outputs.file }}
        run: |
          sh packaging/packages/publish-repo.sh proxmox repo testing "$FILE"
          sh packaging/packages/bucket.sh push repo proxmox
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing-key.asc"
