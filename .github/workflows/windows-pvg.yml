# UNTESTED: written before it ever ran on GitHub's runners. Check every step on a fork first.
#
# The Windows graphics driver for the Mac host, guest/drivers/windows-pvg/. It's cross-built on a Mac, as
# BUILDING.md says: clang and lld-link with Microsoft's driver kit for the kernel driver, llvm-mingw
# for the user-mode parts. Microsoft's kit can't be in git, so the job fetches its NuGet packages
# from nuget.org at build time, checks them against the SHA-256 below, uses them and throws them
# away. Nothing of the kit is cached, uploaded or put in an artifact.
#
# Four jobs, and the key is in one:
#   build    on a Mac, no secret and no environment. Always unsigned: a pull request and main alike.
#   sign     on Windows, only on a push to main or a run by hand on main, in the `windows-driver`
#            environment, which holds the test certificate (WINDOWS_PVG_TEST_PFX, base64, and
#            WINDOWS_PVG_TEST_PFX_PASSWORD) and is limited to main. It signs ruxnwddm.sys and
#            ruxnumd.dll, makes the catalog and signs that (release/sign.ps1). Where the environment
#            has no certificate, as in a fork, it says so and signs nothing, and nothing after it runs.
#   package  on Linux, no secret: lays the signed files out as the Mac app's installer expects
#            (release/package.sh).
#   publish  on Linux, no secret: puts the package on files.ruxn.com, in the project
#            guesthouse-windows-driver, as mac-nightly.yml puts the nightly there. Each file has the
#            version in its name and is written once; only guesthouse-windows-driver-latest.json,
#            which the app reads first, is replaced, last. A version that is up already is not
#            published again: change DriverVer in the INF for a new package.
name: Windows graphics driver (Mac host)

on:
  pull_request:
    paths:
      - "guest/drivers/windows-pvg/**"
      - ".github/workflows/windows-pvg.yml"
  push:
    branches: [main]
    paths:
      - "guest/drivers/windows-pvg/**"
      - ".github/workflows/windows-pvg.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pvg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KIT_VERSION: "10.0.28000.2526"
  WDK_SHA256: dcd83a77c83ee3163fa07b26421c0b132af0ea446d391bda2e63ac6664a261a5
  SDK_SHA256: be1b419491607eae6f7c57844ebab39face9643c51e2af1d9176a3ba0d0b23fc
  SDK_ARM64_SHA256: f890c85f46cc76c094f30fa555a438a212ee3d36165bcd7afdca96bb52c9bc7a
  LLVM_MINGW: llvm-mingw-20261117-ucrt-macos-universal
  LLVM_MINGW_SHA256: 98d340bbb8d46b09ad6886ffba88bd9d5415e131c316de48e6bd7647377446aa
  DXMT_COMMIT: faa73e4a0686e432ce5d3bb99a02b5363d76885c

jobs:
  build:
    name: build on a Mac
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools from Homebrew and pip
        run: |
          ROOT="$RUNNER_TEMP/root"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          brew install ninja lld
          python3 -m venv "$ROOT/.venv"
          "$ROOT/.venv/bin/pip" install meson cmake
      - name: llvm-mingw
        run: |
          mkdir -p "$ROOT/.tools"
          cd "$ROOT/.tools"
          curl -fsSL --retry 3 -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/$LLVM_MINGW.tar.xz"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.tar.xz" | shasum -a 256 -c -
          tar -xf llvm-mingw.tar.xz && mv "$LLVM_MINGW" llvm-mingw && rm llvm-mingw.tar.xz
      # Microsoft's packages, under Microsoft's licence: fetched for this build only.
      - name: Microsoft's driver kit and SDK, from nuget.org
        run: |
          fetch() { # fetch ID SHA256
            mkdir -p "$ROOT/.tools/wdk/$1"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$1.nupkg" \
              "https://api.nuget.org/v3-flatcontainer/$1/$KIT_VERSION/$1.$KIT_VERSION.nupkg"
            echo "$2  $RUNNER_TEMP/$1.nupkg" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/$1.nupkg" -d "$ROOT/.tools/wdk/$1"
            rm "$RUNNER_TEMP/$1.nupkg"
          }
          fetch microsoft.windows.wdk.arm64 "$WDK_SHA256"
          fetch microsoft.windows.sdk.cpp "$SDK_SHA256"
          fetch microsoft.windows.sdk.cpp.arm64 "$SDK_ARM64_SHA256"
      - name: DXMT
        run: |
          git clone --filter=blob:none https://github.com/3Shain/dxmt "$ROOT/.tools/src/dxmt"
          git -C "$ROOT/.tools/src/dxmt" checkout --detach "$DXMT_COMMIT"
      # LLVM 15 is built twice (for the Mac and for Windows on arm64). It takes most of the job.
      - name: airconv and LLVM 15
        run: sh guest/drivers/windows-pvg/dxmt-win/airconv-build.sh "$ROOT"
      - name: Kernel driver, user-mode driver and tools
        run: sh guest/drivers/windows-pvg/ruxnwddm/build.sh "$ROOT"
      - name: winemetal, DXMT and the test programs
        # Without the first triangle's stand-in and the checks that draw on this Mac's GPU: the
        # stand-in needs a shader tool that isn't public, and a release doesn't carry it.
        env:
          RUXN_STANDIN: "0"
          CHECKS: "0"
        run: sh guest/drivers/windows-pvg/dxmt-win/build.sh "$ROOT"
      - name: Gather what the package needs
        run: |
          out="$RUNNER_TEMP/driver"
          mkdir -p "$out"
          cp "$ROOT/build/ruxnwddm/ruxnwddm.sys" "$ROOT/build/ruxnwddm/ruxnumd.dll" \
            guest/drivers/windows-pvg/ruxnwddm/ruxnwddm-full.inf \
            "$ROOT/build/dxmt-win/obj/winemetal.dll" \
            "$ROOT/build/dxmt-win/meson/src/d3d11/ruxnd3d11.dll" \
            "$ROOT/build/dxmt-win/meson/src/dxgi/ruxndxgi.dll" "$out/"
          # Only our own binaries leave the job; none of Microsoft's files are among them.
          ls -l "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pvg-driver
          path: ${{ runner.temp }}/driver
          retention-days: 7

  sign:
    name: sign and make the catalog on Windows
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: windows-2025
    timeout-minutes: 20
    # The environment holds the test certificate, and only main may use it.
    environment: windows-driver
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-pvg-driver
          path: ${{ runner.temp }}/driver
      - name: Sign, and make the catalog
        id: sign
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_PVG_TEST_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PVG_TEST_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) {
            Write-Output 'This environment has no test certificate (a fork, or it is not set up), so nothing is signed.'
            'signed=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          guest/drivers/windows-pvg/release/sign.ps1 -Folder (Join-Path $env:RUNNER_TEMP 'driver')
          'signed=true' >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.sign.outputs.signed == 'true' }}
        with:
          name: windows-pvg-signed
          path: ${{ runner.temp }}/driver
          retention-days: 7

  package:
    name: lay the package out
    needs: sign
    if: ${{ needs.sign.outputs.signed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-pvg-signed
          path: ${{ runner.temp }}/signed
      - name: Package
        run: sh guest/drivers/windows-pvg/release/package.sh "$RUNNER_TEMP/signed" "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-pvg-package
          path: ${{ runner.temp }}/package
          retention-days: 7

  publish:
    name: put it on files.ruxn.com
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: windows-pvg-publish
      cancel-in-progress: false
    # No secret: scripts/files-publish.sh sends this job's GitHub OIDC token, which the file site takes
    # only from this workflow, on main, from a push or a run by hand, for this one project.
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: guesthouse-windows-driver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-pvg-package
          path: package
      - name: Check the package against its manifest and the names the file site takes
        working-directory: package
        run: |
          set -eu
          manifest=guesthouse-windows-driver-latest.json
          version=$(jq -r .version "$manifest")
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          mapfile -t names < <(jq -r '.files[].name' "$manifest")
          [ "${#names[@]}" -eq 9 ]
          for name in "${names[@]}"; do
            printf '%s\n' "$name" | grep -Eq "^guesthouse-windows-driver-$version-(install\.ps1|ruxn-driver\.cer|ruxnwddm\.sys|ruxnwddm-full\.inf|ruxnwddm-full\.cat|ruxnumd\.dll|winemetal\.dll|ruxndxgi\.dll|ruxnd3d11\.dll)\$"
            sha256sum -c "$name.sha256"
            [ "$(sha256sum "$name" | cut -d ' ' -f 1)" = "$(jq -r --arg name "$name" '.files[] | select(.name == $name) | .sha256' "$manifest")" ]
          done
      - name: Publish the files once, then the manifest
        working-directory: package
        run: |
          set -eu
          manifest=guesthouse-windows-driver-latest.json
          version=$(jq -r .version "$manifest")
          up=$(curl -fsSL --max-time 30 "https://files.ruxn.com/p/$PROJECT/$manifest" | jq -r '.version // empty' || true)
          if [ "$up" = "$version" ]; then
            echo "$version is the version up already. A published file never changes, so change DriverVer in the INF for a new package."
            exit 0
          fi
          mapfile -t names < <(jq -r '.files[].name' "$manifest")
          args=()
          for name in "${names[@]}"; do args+=("$name" "$name.sha256"); done
          ../scripts/files-publish.sh "$PROJECT" "${args[@]}"
          ../scripts/files-publish.sh --replace "$PROJECT" "$manifest"
