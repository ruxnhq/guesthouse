[workspace]
resolver = "3"
members = ["crates/*", "tools/card-check", "tools/hcs-boot"]
# Microsoft's windows-reactor and the windows-rs crates it needs, vendored for the Windows app and
# used by path from it. Not members: Windows only, and not this workspace's code.
exclude = ["vendor/windows-reactor", "vendor/windows-rs"]
# The app needs GTK's development files, which nothing else here does. Build it with `-p guesthouse-app`.
default-members = [
    "crates/account",
    "crates/answers",
    "crates/app-core",
    "crates/backend",
    "crates/backend-intel",
    "crates/backend-nvidia",
    "crates/backend-standin",
    "crates/basics",
    "crates/carry",
    "crates/catalog",
    "crates/clock-helper",
    "crates/control",
    "crates/core",
    "crates/daemon",
    "crates/daemon-shell",
    "crates/frame-socket",
    "crates/guest-names",
    "crates/guest-scripts",
    "crates/hcs",
    "crates/idle",
    "crates/host-windows",
    "crates/installer-windows",
    "crates/jail",
    "crates/messages",
    "crates/p9",
    "crates/recipes",
    "crates/relay",
    "crates/remote-view",
    "crates/replay",
    "crates/report",
    "crates/sensors",
    "crates/serial-words",
    "crates/settings",
    "crates/snapshot",
    "crates/start-checks",
    "crates/share-windows",
    "crates/state",
    "crates/service-windows",
    "crates/transport",
    "crates/update-check",
    "crates/window-cells",
    "tools/card-check",
    "tools/hcs-boot",
]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-2.0-or-later"

[workspace.dependencies]
guesthouse-transport = { path = "crates/transport" }
guesthouse-messages = { path = "crates/messages" }
guesthouse-backend = { path = "crates/backend" }
guesthouse-backend-standin = { path = "crates/backend-standin" }
guesthouse-backend-amd = { path = "crates/backend-amd" }
guesthouse-backend-intel = { path = "crates/backend-intel" }
guesthouse-backend-nvidia = { path = "crates/backend-nvidia" }
guesthouse-core = { path = "crates/core" }
guesthouse-daemon = { path = "crates/daemon" }
guesthouse-daemon-shell = { path = "crates/daemon-shell" }
guesthouse-app-core = { path = "crates/app-core" }
guesthouse-frame-socket = { path = "crates/frame-socket" }
guesthouse-sensors = { path = "crates/sensors" }
guesthouse-settings-core = { path = "crates/settings" }
guesthouse-snapshot-core = { path = "crates/snapshot" }
guesthouse-start-checks-core = { path = "crates/start-checks" }
guesthouse-state-core = { path = "crates/state" }
guesthouse-jail = { path = "crates/jail" }
guesthouse-card-check = { path = "tools/card-check" }
guesthouse-control = { path = "crates/control" }
guesthouse-update-check = { path = "crates/update-check" }
guesthouse-hcs = { path = "crates/hcs" }
guesthouse-relay = { path = "crates/relay" }
guesthouse-host-windows = { path = "crates/host-windows" }
guesthouse-remote-view-core = { path = "crates/remote-view" }
guesthouse-report-core = { path = "crates/report" }
guesthouse-basics = { path = "crates/basics" }
guesthouse-account-core = { path = "crates/account" }
guesthouse-answers-core = { path = "crates/answers" }
guesthouse-carry-core = { path = "crates/carry" }
guesthouse-catalog-core = { path = "crates/catalog" }
guesthouse-serial-words-core = { path = "crates/serial-words" }
guesthouse-idle-core = { path = "crates/idle" }
guesthouse-guest-names-core = { path = "crates/guest-names" }
guesthouse-recipes-core = { path = "crates/recipes" }
guesthouse-window-cells-core = { path = "crates/window-cells" }
# The Mac host's graphics process and the guard in front of the framework it calls.
guesthouse-pvg-sys = { path = "crates/pvg-sys" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
# Numbers from a guest reach a lot of arithmetic, and a wrong sum that goes unnoticed could become a
# wrong mapping. A stop is the better failure, and the handlers are meant to refuse such numbers first.
overflow-checks = true
