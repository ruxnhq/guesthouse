[package]
name = "guesthouse-app-core"
description = "Everything the desktop app does that needs no display: machines, tasks, setup and the VM's start."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "guesthouse-task"
path = "src/bin/task.rs"

[[bin]]
name = "guesthouse-share"
path = "src/bin/share.rs"

[[bin]]
name = "guesthouse-check"
path = "src/bin/check.rs"

[[bin]]
name = "guesthouse-report"
path = "src/bin/report.rs"

[[bin]]
name = "guesthouse-vm"
path = "src/bin/vm.rs"

[[bin]]
name = "guesthouse-jail"
path = "src/bin/jail.rs"

[[bin]]
name = "guesthouse-remote-view"
path = "src/bin/remote_view.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# The NVIDIA backend's driver profiles, so setup knows the daemon's branches. It opens nothing.
guesthouse-backend-nvidia.workspace = true
# Whether a newer release is out, as every host decides it.
guesthouse-update-check.workspace = true
# Reads a recorded Intel card, for a lab run on a PC without one. It opens nothing.
guesthouse-backend-intel.workspace = true
# Only for its slot names, so the app and the daemon can never disagree about what a VM owns.
guesthouse-daemon.workspace = true
# The jail QEMU runs in, which guesthouse-jail puts it in, and what this PC's kernel offers for one.
guesthouse-jail.workspace = true
# The part of card-check that reads the NVIDIA driver's files without opening the card, for bug reports.
guesthouse-card-check.workspace = true
# The UDP relay that puts a machine's remote view on the network, which guesthouse-remote-view runs.
guesthouse-relay.workspace = true
# What a machine's remote view shows and how its pairing goes, which every host shares.
guesthouse-remote-view-core.workspace = true
# The host card's readings, which the daemon's sensor thread publishes and the overlay shows.
guesthouse-sensors.workspace = true
# Local time for the log and for snapshot dates. The standard library has no time zones.
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Reading C headers for the tables a guest's modules are built with.
regex = "1"
# Machine files, task files and QMP are all JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recipes are small hand-written files with scripts in them, which TOML holds as plain text.
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
# Telling whether a guest already has this program's copy of a file, without sending it.
sha2 = "0.11"
# Safe calls for statvfs, flock, kill, access, getxattr and a send that never waits, which keeps `unsafe` out of this crate.
rustix = { version = "1", features = ["fs", "net", "process"] }
# The helper's mDNS responder, which announces a shared machine as remoteman's viewers look for it.
mdns-sd = { version = "0.22", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# ptrace, for a test that QEMU's jail refuses it.
libc = "0.2"

# A program under guesthouse-jail, which can't leave the jail, so each case is a process of its own.
[[test]]
name = "jail"
harness = false

# The whole flow of a VM with pretend programs, which needs a main of its own to be them.
[[test]]
name = "flow"
harness = false

[lints]
workspace = true
