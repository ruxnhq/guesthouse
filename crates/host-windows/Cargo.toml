[package]
name = "guesthouse-host-windows"
description = "Guest machines on a Windows host: making their disks from an ISO, running them through HCS with GPU-PV, and what they say as they do."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The jailed reader of a guest's serial port, which a booting machine starts beside the program
# that boots it.
[[bin]]
name = "guesthouse-serial-relay"
path = "src/relay.rs"

[dependencies]
# The events it says what it does in, as the service sends them on to the app.
guesthouse-control.workspace = true
guesthouse-hcs.workspace = true
# A Windows guest's screen: the remoteman viewer's identity, made as remoteman makes its own, and
# fingerprints.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.11"
# The record beside each disk, and events and settings as the service's pipe carries them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The jail the serial relay runs in.
[target.'cfg(windows)'.dependencies]
guesthouse-jail.workspace = true

[lints]
workspace = true
