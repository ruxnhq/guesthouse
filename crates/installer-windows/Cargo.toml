[package]
name = "guesthouse-installer-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Guesthouse's installer for Windows: one downloadable file, guesthouse-setup-VERSION.exe, and
# the uninstaller Settings > Apps runs. Its pages are WinUI 3 through Microsoft's windows-reactor
# (vendor/windows-reactor); the files it installs, and the Windows App Runtime its pages need,
# are packed into the exe itself (src/archive.rs). It holds no rule of the product's: the system
# steps are windows/installer/setup.ps1's, which it only runs. src/main.rs says how the one
# file becomes the three processes it runs as. Everything it needs is Windows-only, so on other
# systems this crate builds to a stub.
[[bin]]
name = "guesthouse-setup"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-reactor = { path = "../../vendor/windows-reactor" }
# What the installer asks of Windows: elevation, processes, the service manager, the registry, the shell
# (shortcuts, the UAC prompt) and Temp. The pages' own types come from windows-reactor.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The packed files: XZ (LZMA2 behind the x86 branch filter), pure Rust, Apache-2.0.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
# Each packed file's hash, checked when it is written.
sha2 = "0.11"
# The archive's index at the end of the exe.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
# Stages the Windows App Runtime beside the exe and embeds the manifest that finds it there; the
# installer packs those files into itself (scripts/windows-setup.ps1).
windows-reactor-setup = { path = "../../vendor/windows-rs/reactor-setup" }
# The exe's icon and its name in Windows (the UAC prompt shows it).
winresource = "0.1"

[lints]
workspace = true
