[package]
name = "guesthouse-update-check"
description = "Whether a newer Guesthouse is out, from the small file a release publishes, for every host. Nothing here calls the OS or the network: each host fetches the file its own way."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

