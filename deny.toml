# What cargo deny checks. Everything here is GPL-2.0-or-later, so a dependency has to be
# something that licence can take in.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "GPL-2.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # ksni, which speaks the tray's protocol for the app's icon.
    "Unlicense",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
