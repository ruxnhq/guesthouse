# Guesthouse's weston, on the Mac's graphics device. desktop-prepare copies
# it to /run/guesthouse/weston.ini with the scale the Mac app gives
# (opt/com.ruxn.guesthouse/scale by fw_cfg) and the renderer; one in the
# account's ~/.config/weston.ini is taken in its place.
# The renderer is GL, on GBM and EGL through our Mesa (Zink on our Vulkan
# driver): weston 14's pixman renderer takes no dma-buf, so GL clients would
# not show on it.

[core]
backend=drm
renderer=gl
idle-time=0
require-input=false
xwayland=true

[shell]
panel-position=top
clock-format=minutes
locking=false
background-color=0xff1d3340

[keyboard]
# The Mac's layout, which desktop-prepare puts here from the app at each
# start; German when the app gives none. The Mac's Option keys are Alt and
# AltGr (left and right).
keymap_rules=evdev
keymap_model=pc105
keymap_layout=de
keymap_variant=
repeat-rate=30
repeat-delay=400

[output]
name=Virtual-1
mode=preferred
scale=1

[launcher]
icon=/usr/share/weston/terminal.png
path=/usr/bin/foot

[launcher]
icon=/usr/share/weston/icon_flower.png
path=/usr/bin/weston-flower

[terminal]
font=DejaVu Sans Mono
font-size=14
