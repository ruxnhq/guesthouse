# The kernel driver pvg for Apple's ParavirtualizedGraphics device, built by
# DKMS for every kernel that has its headers. The sources are guest/drivers/linux-pvg's
# driver/ and uapi/, as they lie there.
PACKAGE_NAME="pvg"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="pvg"
BUILT_MODULE_LOCATION[0]="driver/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/driver modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/driver clean"
AUTOINSTALL="yes"
