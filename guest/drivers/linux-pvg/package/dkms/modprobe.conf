# Guesthouse: settings of the driver for the Mac's graphics device. The
# defaults are right for the Mac app; `modinfo pvg` lists them all.
#   firmware=1     take the screen from the firmware's framebuffer at probe
#   replug=1       show the connector gone for a moment when the size changes
#   settle_ms=1500 how long a new mode list has to stay before it is taken
#options pvg settle_ms=1500
