<?xml version="1.0" standalone="yes"?>
<!--
SPDX-License-Identifier: MIT

Mesa's driver options for Zink on the DRM device pvg, installed with the
desktop build into /opt/pvg-mesa/share/drirc.d. They name the driver zink,
not the kernel driver pvg: Gallium's loader parses its options with no
kernel driver's name, so kernel_driver="pvg" never matches. This Mesa is
for pvg alone.

allow_rgb10_configs: what another program takes from Zink here is a surface
of BGRA8, so a window of 10 bits a channel has no buffer to hand weston.
es2gears_wayland took such a config and showed nothing.
-->
<driconf>
  <device driver="zink">
    <application name="Default">
      <option name="allow_rgb10_configs" value="false" />
    </application>
  </device>
</driconf>
