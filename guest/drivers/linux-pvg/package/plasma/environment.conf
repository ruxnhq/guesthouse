# Guesthouse: settings for the programs of a desktop session on the pvg device
# (systemd's user manager reads this file).
# GTK 4 asks Vulkan for what our driver lacks (samplerYcbcrConversion) and
# finds no EGL configuration of its liking; it then draws with cairo anyway.
GSK_RENDERER=cairo
QT_QUICK_BACKEND=software
# As /etc/guesthouse/mesa.env says.
ZINK_DEBUG=quiet
MESA_SHADER_CACHE_DISABLE=true
