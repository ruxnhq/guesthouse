[package]
name = "guesthouse-app-core"
description = "Everything the desktop app does that needs no display: machines, tasks, setup and the VM's start."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "guesthouse-task"
path = "src/bin/task.rs"

[[bin]]
name = "guesthouse-share"
path = "src/bin/share.rs"

[[bin]]
name = "guesthouse-check"
path = "src/bin/check.rs"

[[bin]]
name = "guesthouse-report"
path = "src/bin/report.rs"

[[bin]]
name = "guesthouse-vm"
path = "src/bin/vm.rs"

[[bin]]
name = "guesthouse-jail"
path = "src/bin/jail.rs"

[[bin]]
name = "guesthouse-remote-view"
path = "src/bin/remote_view.rs"

[target.'cfg(target_os = "linux")'.dependencies]
# The NVIDIA backend's driver profiles, so setup knows the daemon's branches. It opens nothing.
guesthouse-backend-nvidia.workspace = true
# Whether a newer release is out, as every host decides it.
guesthouse-update-check.workspace = true
# Small pieces every host shares that belong to no one subject.
guesthouse-basics.workspace = true
# Which names and passwords a guest's account takes, the rules every host shares.
guesthouse-account-core.workspace = true
# The building blocks of a guest's unattended install, as each host has them.
guesthouse-answers-core.workspace = true
# The export file's format, which every host can read and write.
guesthouse-carry-core.workspace = true
# Where a guest's images come from, and the rule that picks Ubuntu's disc, as data every host can share.
guesthouse-catalog-core.workspace = true
# A machine's states and their words, which every host shares.
guesthouse-state-core.workspace = true
# Reads a recorded Intel card, for a lab run on a PC without one. It opens nothing.
guesthouse-backend-intel.workspace = true
# Only for its slot names, so the app and the daemon can never disagree about what a VM owns.
guesthouse-daemon.workspace = true
# The jail QEMU runs in, which guesthouse-jail puts it in, and what this PC's kernel offers for one.
guesthouse-jail.workspace = true
# The part of card-check that reads the NVIDIA driver's files without opening the card, for bug reports.
guesthouse-card-check.workspace = true
# The UDP relay that puts a machine's remote view on the network, which guesthouse-remote-view runs.
guesthouse-relay.workspace = true
# What a machine's remote view shows and how its pairing goes, which every host shares.
guesthouse-remote-view-core.workspace = true
# What a bug report is, which every host shares.
guesthouse-report-core.workspace = true
# The rules for a Windows guest's file names and the folders Defender may leave out.
guesthouse-guest-names-core.workspace = true
# Whether a running machine looks idle: the verdict, the reading of the guest's answer and the words.
guesthouse-idle-core.workspace = true
# Recipes and lean Windows: the format, the shelf, the words, the fit and the files a machine keeps.
guesthouse-recipes-core.workspace = true
# App windows' lines with the guest's helper, the model of its cells, their geometry and their words.
guesthouse-window-cells-core.workspace = true
# What a guest says on its serial port and how it is read, as each host has them.
guesthouse-serial-words-core.workspace = true
# The checks of a machine's settings that take plain values, as each host has them.
guesthouse-settings-core.workspace = true
# The snapshot names, tags and the file beside each, as each host has them.
guesthouse-snapshot-core.workspace = true
# Why a machine can't start, judged from facts read here, as each host has it.
guesthouse-start-checks-core.workspace = true
# The plain half of a download: its files' names, curl's words, the check and the sentences.
guesthouse-download-core.workspace = true
# The plain half of an install's steps: the words said, each wait, the quiet-disk rule, the sentences.
guesthouse-install-steps-core.workspace = true
# The host card's readings, which the daemon's sensor thread publishes and the overlay shows.
guesthouse-sensors.workspace = true
# Local time for the log and for snapshot dates. The standard library has no time zones.
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Reading C headers for the tables a guest's modules are built with.
regex = "1"
# Machine files, task files and QMP are all JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Telling whether a guest already has this program's copy of a file, without sending it.
sha2 = "0.11"
# Safe calls for statvfs, flock, kill, access, getxattr and a send that never waits, which keeps `unsafe` out of this crate.
rustix = { version = "1", features = ["fs", "net", "process"] }
# The helper's mDNS responder, which announces a shared machine as remoteman's viewers look for it.
mdns-sd = { version = "0.22", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# ptrace, for a test that QEMU's jail refuses it.
libc = "0.2"

# A program under guesthouse-jail, which can't leave the jail, so each case is a process of its own.
[[test]]
name = "jail"
harness = false

# The whole flow of a VM with pretend programs, which needs a main of its own to be them.
[[test]]
name = "flow"
harness = false

[lints]
workspace = true
