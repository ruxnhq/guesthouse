[package]
name = "guesthouse-pvg-sys"
description = "Apple's paravirtualized graphics device on a macOS host: the device, its display and its surface mapper as calls a program may make, with a guard on what a guest says to them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# mmap, which the standard library does not offer: the framework takes a guest's memory only as
# mappings of their own. Unix only, as the crate is.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
