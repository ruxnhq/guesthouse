[package]
name = "guesthouse-carry-core"
description = "The file a machine is exported in and imported from: its format, written and read with no calls into the system, so every host can carry a machine the same way."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Each file's header and trailer is a line of JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Each file's bytes are checked against their SHA-256.
sha2 = "0.11"

[lints]
workspace = true
