[package]
name = "guesthouse-control"
description = "The words between Guesthouse's app and its service on a Windows host, on the service's pipe, and the app's end of the pipe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The ssh line, and reading and writing a JSON line, as every host may.
guesthouse-basics.workspace = true
# Which names a guest's administrator takes, the rules every host shares.
guesthouse-account-core.workspace = true
# What a guest says on its serial port and how it is read, as each host has them.
guesthouse-serial-words-core.workspace = true
# The checks of a machine's settings that take plain values, as each host has them.
guesthouse-settings-core.workspace = true
# A machine's states, which every host shares, with the names the pipe sends.
guesthouse-state-core.workspace = true
# Each request and answer is a line of JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The version check the hosts share.
guesthouse-update-check.workspace = true
# Where viewing a machine from other devices stands, in the words every host answers with.
guesthouse-remote-view-core.workspace = true
# What a bug report is, which every host shares.
guesthouse-report-core.workspace = true

# The console example reads and writes the console's pipe overlapped, so a read waiting on it never
# holds up a write.
[target.'cfg(windows)'.dev-dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"]

[lints]
workspace = true
