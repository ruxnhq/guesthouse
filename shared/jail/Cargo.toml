[package]
name = "guesthouse-jail"
description = "What a process that faces a guest may still do: on Linux Landlock, seccomp and no new privileges, set up from inside; on Windows an AppContainer, process mitigations and a job, set up at its start."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The raw system calls for Landlock and seccomp, which the standard library does not offer.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# AppContainers, job objects and a jailed process's start, which the standard library does not offer.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
]

[lints]
workspace = true

# Each case jails a child process of its own, as a jail can't be taken off again.
[[test]]
name = "kernel"
harness = false
