[package]
name = "guesthouse-snapshot-core"
description = "The rules of a machine's snapshots that take plain values, as each host has them: the names they may have, the tag and file a snapshot is kept under, and the index of a chain of disks. Nothing here calls the system, so every host can build on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The Windows host's index and its entries are kept as JSON.
serde = { version = "1", features = ["derive"] }
# The file beside each of the Linux host's snapshots, and the Windows host's index, are JSON.
serde_json = "1"

[lints]
workspace = true
