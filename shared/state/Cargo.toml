[package]
name = "guesthouse-state-core"
description = "A machine's states and their words, one list for every host, with the names that go over the wire. Nothing here calls the system, so every host can build on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The states go over the Windows host's pipe as JSON.
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The tests read and write the states as the pipe does.
serde_json = "1"

[lints]
workspace = true
