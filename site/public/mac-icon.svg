<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 400 400">
  <!-- The app icon as the design's Icon board draws it: the house on a white to pale blue tile. The house is the brand's own (the repo's scalable icon). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="24" x2="0" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e3f6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="90" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d8be6"/>
      <stop offset="1" stop-color="#1c63c4"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="180" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf27a"/>
      <stop offset="1" stop-color="#f6c42d"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="352" height="352" rx="82" fill="url(#tile)"/>
  <rect x="24.5" y="24.5" width="351" height="351" rx="81.5" fill="none" stroke="#000000" stroke-opacity="0.12"/>
  <g transform="translate(84 80) scale(1.82)">
    <path d="M64 22 106 58V106H22V58Z" fill="#e4effc" stroke="url(#wall)" stroke-width="12" stroke-linejoin="round"/>
    <path d="M64 58 83 74V89H45V74Z" fill="url(#warm)" stroke="url(#warm)" stroke-width="8" stroke-linejoin="round"/>
    <rect x="60" y="80" width="8" height="13" rx="2" fill="#e5a50a"/>
  </g>
</svg>
