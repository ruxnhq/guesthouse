# Starts Ubuntu's installer from its ISO with no menu, unattended, with its console on the serial
# port as well as the screen, so the host can follow it. The files disk this sits on is also the
# installer's answer file, by its label, CIDATA.
set timeout=0
search --no-floppy --set=installer --file /casper/vmlinuz
menuentry "Install Ubuntu for Guesthouse" {
    linux ($installer)/casper/vmlinuz autoinstall ds=nocloud console=tty0 console=ttyS0,115200 ---
    initrd ($installer)/casper/initrd
}
