[package]
name = "guesthouse-app-windows"
description = "The app on a Windows host: a window that lists the machines and starts, stops, makes and deletes them, by asking the Guesthouse service on its pipe."
version.workspace = true
edition.workspace = true
# The stub elsewhere needs nothing newer. On Windows, windows-reactor asks for 1.95 itself.
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# WinUI 3 through Microsoft's windows-reactor (vendor/windows-reactor), as remoteman's Windows apps
# are. The app holds no rule of its own: it shows what the service says and asks it for what the
# person chose. Everything it needs is Windows-only, so on other systems this crate builds to a stub.
#
# The program is guesthouse-app.exe: "guesthouse" is the GTK app's, and Cargo refuses two programs
# of one name in one workspace build.
[[bin]]
name = "guesthouse-app"
path = "src/main.rs"

[features]
# Made-up machines in place of the service's, chosen by GUESTHOUSE_APP_PREVIEW, so each of the
# window's states can be looked at, light or dark, without a service or a GPU. See src/app/preview.rs.
preview = []

[target.'cfg(windows)'.dependencies]
# How a machine's and a card's memory are said, with the other hosts' small wording.
guesthouse-basics.workspace = true
# The words on the service's pipe, and the pipe itself. The only way the app reaches the service.
guesthouse-control.workspace = true
# The app's own settings, kept as a small JSON file (src/preferences.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SHA-256 of a downloaded update, checked before it's run. The same crate and version as the
# installer's.
sha2 = "0.11"
windows-reactor = { path = "../../vendor/windows-reactor" }
# Remote View's states, wording and limits, the same as every host shows them.
guesthouse-remote-view-core.workspace = true
# This PC's address on its network, which a device types in to view a machine.
guesthouse-relay.workspace = true
# The few calls WinUI doesn't make for us: the file dialog, the clipboard, cancelling a read that
# waits on the pipe, and the console, which is Windows' Remote Desktop control in a window of our
# own (OLE and variants for the control, the library loader for RdpBase and ATL, the pipe's wait,
# and the window), the registry, where Windows keeps what opens when the person signs in, a job
# that ends an update's download with the app, and the restart that finishes turning on Hyper-V.
# The same crate and version as `hcs`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# What the Remote View group shows and asks is plain logic, tested on any system: these are the
# words it uses and the requests it makes, which the tests hold.
guesthouse-remote-view-core.workspace = true
guesthouse-control.workspace = true
# The requests' words on the wire, which the tests compare.
serde_json = "1"
# The app's own settings and how an update stands are plain logic too, tested on any system.
guesthouse-basics.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

[target.'cfg(windows)'.build-dependencies]
# Stages the Windows App Runtime beside the exe and embeds the manifest that finds it there, so the
# app runs on a PC that never installed the runtime.
windows-reactor-setup = { path = "../../vendor/windows-rs/reactor-setup" }
# The exe's icon, and its name in Windows.
winresource = "0.1"

[lints]
workspace = true
