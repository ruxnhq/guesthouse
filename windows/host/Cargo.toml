[package]
name = "guesthouse-host-windows"
description = "Guest machines on a Windows host: making their disks from an ISO, running them through HCS with GPU-PV, and what they say as they do."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# The jailed reader of a guest's serial port, which a booting machine starts beside the program
# that boots it.
[[bin]]
name = "guesthouse-serial-relay"
path = "src/relay.rs"

[dependencies]
# Which names a guest's administrator takes, as each host has them.
guesthouse-account-core.workspace = true
# What a guest's unattended install is given, as each host makes it.
guesthouse-answers-core.workspace = true
# The events it says what it does in, as the service sends them on to the app.
guesthouse-control.workspace = true
guesthouse-hcs.workspace = true
# A Windows guest's screen, through remoteman: the part that no host differs in.
guesthouse-remote-view-core.workspace = true
# What a shared folder is called in the guest.
guesthouse-guest-names-core.workspace = true
# The snapshot index and the label and count rules, as each host has them.
guesthouse-snapshot-core.workspace = true
# What a guest says on its serial port and how it is read, as each host has them.
guesthouse-serial-words-core.workspace = true
# The record beside each disk, and events and settings as the service's pipe carries them.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# This PC's addresses, which a guest lets reach its screen's port.
if-addrs = "0.15"

# The jail the serial relay runs in.
[target.'cfg(windows)'.dependencies]
guesthouse-jail.workspace = true

[lints]
workspace = true
